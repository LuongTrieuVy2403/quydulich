<script>
    // === DÁN URL WEB APP GOOGLE APPS SCRIPT CỦA BẠN VÀO ĐÂY ===
    var API_URL = "https://script.google.com/macros/s/AKfycbzZPvkmM9MreCRyY-MoOF0a0LuHokuGWM_e6zyuVE1aWihry-CXhavrbACgAo0v6gdZ/exec";

    var BANK_ID = "VCB"; 
    var ACCOUNT_NO = "1066287627"; 
    var ACCOUNT_NAME = "LUONG TRIEU VY"; 

    var currentSummary = { tongQuy: 0, daChi: 0, conLai: 0 };
    var toastTimeout;

    function removeVietnameseTones(str) {
      if (!str) return '';
      str = str.replace(/à|á|ạ|ả|ã|â|ầ|ấ|ậ|ẩ|ẫ|ă|ằ|ắ|ặ|ẳ|ẵ/g,"a");
      str = str.replace(/è|é|ẹ|ẻ|ẽ|ê|ề|ế|ệ|ể|ễ/g,"e");
      str = str.replace(/ì|í|ị|ỉ|ĩ/g,"i");
      str = str.replace(/ò|ó|ọ|ỏ|õ|ô|ồ|ố|ộ|ổ|ỗ|ơ|ờ|ớ|ợ|ở|ỡ/g,"o");
      str = str.replace(/ù|ú|ụ|ủ|ũ|ư|ừ|ứ|ự|ử|ữ/g,"u");
      str = str.replace(/ỳ|ý|ỵ|ỷ|ỹ/g,"y");
      str = str.replace(/đ/g,"d");
      return str;
    }

    function formatCurrencyInput(input) {
      var rawValue = input.value.replace(/\D/g, '');
      if (!rawValue) { input.value = ''; return; }
      input.value = Number(rawValue).toLocaleString('en-US');
    }

    function getCleanNumber(inputId) {
      var val = document.getElementById(inputId).value;
      return Number(val.replace(/\D/g, '')) || 0;
    }

    function showToast(msg, type) {
      type = type || 'info';
      var toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.className = 'show ' + type;
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(function() { toast.className = ''; }, 3200);
    }

    function fmt(num) { return new Intl.NumberFormat('vi-VN').format(num || 0) + ' đ'; }

    function updateSummaryUI(tongQuy, daChi, conLai) {
      currentSummary.tongQuy = tongQuy;
      currentSummary.daChi = daChi;
      currentSummary.conLai = conLai;

      var elTong = document.getElementById('tongQuy');
      var elChi = document.getElementById('daChi');
      var elCon = document.getElementById('conLai');

      elTong.innerText = fmt(tongQuy);
      elChi.innerText = fmt(daChi);
      elCon.innerText = fmt(conLai);

      elTong.classList.remove('loading-text');
      elChi.classList.remove('loading-text');
      elCon.classList.remove('loading-text');
    }

    function toggleAdminPanel() {
      var panel = document.getElementById('adminPanel');
      var isHidden = (panel.style.display === 'none' || panel.style.display === '');
      panel.style.display = isHidden ? 'block' : 'none';
      if (isHidden) panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function switchTab(type) {
      var tabSub = document.getElementById('subExpenseTab');
      var tabAdd = document.getElementById('addContributionTab');
      var btnSub = document.getElementById('tabSubBtn');
      var btnAdd = document.getElementById('tabAddBtn');

      if (type === 'sub') {
        tabSub.style.display = 'block';
        tabAdd.style.display = 'none';
        btnSub.classList.add('active');
        btnAdd.classList.remove('active');
      } else {
        tabSub.style.display = 'none';
        tabAdd.style.display = 'block';
        btnAdd.classList.add('active');
        btnSub.classList.remove('active');
      }
    }

    function toggleSelectAll(master) {
      var checkboxes = document.querySelectorAll('.member-single-check');
      checkboxes.forEach(function(cb) { cb.checked = master.checked; });
    }

    function checkMasterStatus() {
      var checkboxes = document.querySelectorAll('.member-single-check');
      var allChecked = true;
      checkboxes.forEach(function(cb) { if (!cb.checked) allChecked = false; });
      document.getElementById('checkAll').checked = allChecked;
    }

    // --- TẢI DỮ LIỆU QUA FETCH API ---
    function loadData() {
      // 1. Tổng quan
      fetch(API_URL + "?action=summary")
        .then(res => res.json())
        .then(d => updateSummaryUI(d.tongQuy, d.daChi, d.conLai))
        .catch(err => console.error(err));

      // 2. Thành viên
      fetch(API_URL + "?action=members")
        .then(res => res.json())
        .then(members => {
          var container = document.getElementById('individualMembers');
          var select = document.getElementById('depositMemberSelect');
          var htmlCheckbox = '';
          var htmlSelect = '<option value="">-- Chọn thành viên --</option>';

          members.forEach(function(m) {
            htmlCheckbox += '<label class="member-item">' +
              '<input type="checkbox" class="member-single-check" value="' + m + '" onchange="checkMasterStatus()">' +
              '<span>' + m + '</span>' +
            '</label>';
            htmlSelect += '<option value="' + m + '">' + m + '</option>';
          });

          container.innerHTML = htmlCheckbox;
          select.innerHTML = htmlSelect;
        });

      // 3. Lịch sử chi tiêu
      fetch(API_URL + "?action=expenses")
        .then(res => res.json())
        .then(list => {
          var html = '';
          if (list.length === 0) {
            html = '<tr><td colspan="4" style="text-align: center; color: #6c7a89;">Chưa có lịch sử chi tiêu</td></tr>';
          } else {
            list.forEach(function(item) {
              html += '<tr>' +
                '<td style="color:#6c7a89;">' + item.time + '</td>' +
                '<td><b>' + item.description + '</b></td>' +
                '<td style="color:#00a8ff;">' + item.target + '</td>' +
                '<td class="spent" style="text-align: right;">-' + fmt(item.amount) + '</td>' +
              '</tr>';
            });
          }
          document.getElementById('historyTable').innerHTML = html;
        });
    }

    function searchMember() {
      var name = document.getElementById('searchName').value;
      if (!name) return showToast("⚠️ Vui lòng nhập tên thành viên!", "warning");
      
      var btn = document.getElementById('btnSearch');
      btn.innerText = "ĐANG TÌM...";
      btn.disabled = true;

      fetch(API_URL + "?action=search&name=" + encodeURIComponent(name))
        .then(res => res.json())
        .then(res => {
          btn.innerText = "Xem Số Dư";
          btn.disabled = false;

          if (res.found) {
            document.getElementById('resName').innerText = res.name;
            document.getElementById('resDong').innerText = fmt(res.daDong);
            document.getElementById('resDung').innerText = fmt(res.daDung);
            document.getElementById('resDu').innerText = fmt(res.conDu);
            document.getElementById('searchResult').style.display = 'block';
            showToast("✨ Đã tìm thấy thông tin!", "success");
          } else {
            showToast("❌ Không tìm thấy thành viên!", "error");
            document.getElementById('searchResult').style.display = 'none';
          }
        });
    }

    function submitExpense() {
      var pass = document.getElementById('adminPass').value;
      var desc = document.getElementById('desc').value;
      var amount = getCleanNumber('amount');
      var note = document.getElementById('note').value;
      var selectedTargets = [];
      var isAllChecked = document.getElementById('checkAll').checked;
      
      if (isAllChecked) {
        selectedTargets = "Tất cả";
      } else {
        var checkboxes = document.querySelectorAll('.member-single-check:checked');
        checkboxes.forEach(function(cb) { selectedTargets.push(cb.value); });
      }

      if (!pass) return showToast("⚠️ Vui lòng nhập mật khẩu Admin!", "warning");
      if (!desc || !amount || amount <= 0) return showToast("⚠️ Vui lòng nhập đầy đủ thông tin!", "warning");
      if (Array.isArray(selectedTargets) && selectedTargets.length === 0) {
        return showToast("⚠️ Vui lòng chọn ít nhất 1 thành viên!", "warning");
      }

      var btn = document.getElementById('btnSubmitExpense');
      btn.disabled = true;
      btn.innerText = 'ĐANG XỬ LÝ...';

      fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "addExpense",
          password: pass,
          description: desc,
          targetList: selectedTargets,
          amount: amount,
          note: note
        })
      })
      .then(res => res.json())
      .then(res => {
        btn.disabled = false;
        btn.innerText = 'XÁC NHẬN TRỪ TIỀN';
        if (res.success) {
          showToast("🎉 " + res.message, "success");
          document.getElementById('desc').value = '';
          document.getElementById('amount').value = '';
          document.getElementById('note').value = '';
          loadData();
        } else {
          showToast("⛔ " + res.message, "error");
        }
      });
    }

    function submitDeposit() {
      var pass = document.getElementById('adminPass').value;
      var memberName = document.getElementById('depositMemberSelect').value;
      var amount = getCleanNumber('depositAmount');

      if (!pass) return showToast("⚠️ Vui lòng nhập mật khẩu Admin!", "warning");
      if (!memberName) return showToast("⚠️ Vui lòng chọn thành viên!", "warning");
      if (!amount || amount <= 0) return showToast("⚠️ Vui lòng nhập số tiền hợp lệ!", "warning");

      var btn = document.getElementById('btnSubmitDeposit');
      btn.disabled = true;
      btn.innerText = 'ĐANG XỬ LÝ...';

      fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "addContribution",
          password: pass,
          memberName: memberName,
          amount: amount
        })
      })
      .then(res => res.json())
      .then(res => {
        btn.disabled = false;
        btn.innerText = 'XÁC NHẬN CỘNG TIỀN';
        if (res.success) {
          showToast("🎉 " + res.message, "success");
          var memoText = removeVietnameseTones(memberName) + " dong quy du lich";
          var qrUrl = "https://img.vietqr.io/image/" + BANK_ID + "-" + ACCOUNT_NO + "-compact2.png?amount=" + amount + "&addInfo=" + encodeURIComponent(memoText) + "&accountName=" + encodeURIComponent(ACCOUNT_NAME);
          
          document.getElementById('qrImage').src = qrUrl;
          document.getElementById('qrMember').innerText = memberName;
          document.getElementById('qrAmount').innerText = fmt(amount);
          document.getElementById('qrMemo').innerText = memoText;
          document.getElementById('qrModal').style.display = 'flex';
          document.getElementById('depositAmount').value = '';
          loadData();
        } else {
          showToast("⛔ " + res.message, "error");
        }
      });
    }

    function closeQRModal() {
      document.getElementById('qrModal').style.display = 'none';
    }

    window.onload = loadData;
  </script>
